<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok OAuth Callback</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 120px; font-size: 14px; }
  button { padding: 10px 16px; font-size: 16px; margin-top: 10px; }
</style>
</head>
<body>
<h1>TikTok Login — Code erhalten</h1>
<p>Kopiere den Text unten komplett und schick ihn an Claude/Niko-Bot.</p>
<textarea id="out" readonly></textarea>
<br>
<button onclick="copyIt()">Kopieren</button>
<script>
document.getElementById('out').value = window.location.href;
function copyIt() {
  const el = document.getElementById('out');
  el.select();
  document.execCommand('copy');
}
</script>
</body>
</html>
